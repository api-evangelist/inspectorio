          example: Acme Corp
          minLength: 1
          type: string
        officeId:
          description: Office ID
          example: office_123
          nullable: true
          type: string
        organizationLabels:
          description: List of organization labels
          example:
          - Tier 1
          - Tier 2
          items:
            type: string
          nullable: true
          type: array
        phone:
          description: Organization phone number
          example: '1505111222'
          minLength: 1
          type: string
        postal:
          description: Organization postal code
          example: A1B2C3
          nullable: true
          type: string
        province:
          description: Province where the organization locates
          example: New York
          nullable: true
          type: string
        type:
          description: Support F(Factory) S(Supplier) B(Brand) R(Retailer) V(Vendor)
          example: S
          minLength: 1
          type: string
        updatedAt:
          description: Last updated date and time of the organization in the system
          example: '2021-06-02 12:34:02.861000+00:00'
          readOnly: true
          type: string
        description:
          nullable: true
          example: This is a description
          description: description of the local organization
          type: string
      required:
      - address
      - contacts
      - country
      - name
      - phone
      - type
      type: object
    ValidateApiError:
