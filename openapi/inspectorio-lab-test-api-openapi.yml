components:
  schemas:
    LabTestCondition:
      type: object
      properties:
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        result:
          nullable: true
          $ref: '#/components/schemas/ResultEnum'
        samples:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/LabTestSample'
        followUpAction:
          nullable: true
          $ref: '#/components/schemas/LabTestFollowUpAction'
    BaseLabTestDetailResponseInfix:
      type: object
      properties:
        questionnaire:
          type: object
          properties:
            forTestCreation:
              $ref: '#/components/schemas/QuestionnaireObject'
            forTestExecution:
              $ref: '#/components/schemas/QuestionnaireObject'
        attachments:
          type: object
          properties:
            generalInformation:
              $ref: '#/components/schemas/AttachmentObject'
            testResult:
              $ref: '#/components/schemas/AttachmentObject'
            questionnaire:
              $ref: '#/components/schemas/AttachmentObject'
            activity:
              $ref: '#/components/schemas/AttachmentObject'
            followUpAction:
              $ref: '#/components/schemas/AttachmentObject'
        sampleReceiptDate:
          type: string
          format: date
          description: Sample receipt date
          example: '2024-01-10'
        reportIssueDate:
          type: string
          format: date
          description: Report issue date
          example: '2024-01-15'
        reportNumber:
          type: string
          description: Report number
          example: RPT-2024-001
        originalReportNumber:
          type: string
          description: Original report number
          example: RPT-2024-001
        revisionNumber:
          type: integer
          description: Revision number
          example: 0
        testPackages:
          type: array
          description: Test packages
          items:
            type: object
            properties:
              id:
                type: string
                description: Test package id
                example: TP-2024-001
              name:
                type: string
                description: Test package name
                example: Chemical Test Package
              type:
                type: string
                nullable: true
                description: Test package type
    LabTest:
      description: 'Lab Test Serializer


        **Entity Type Constraint**: Only one entity type (items, materials, or styles) should be provided per request.

        '
      allOf:
      - $ref: '#/components/schemas/LabTestBase'
      - oneOf:
        - title: Item
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LabTestItem'
              description: Array of items for the lab test
          required:
          - items
          additionalProperties: false
        - title: Material
          type: object
          properties:
            materials:
              type: array
              items:
                $ref: '#/components/schemas/LabTestCreateMaterial'
              description: Array of materials for the lab test
          required:
          - materials
          additionalProperties: false
        - title: Style
          type: object
          properties:
            styles:
              type: array
              items:
                $ref: '#/components/schemas/LabTestCreateStyle'
              description: Array of styles for the lab test
          required:
          - styles
          additionalProperties: false
    LabTestListResponseItemObject:
      type: object
      properties:
        itemIds:
          type: array
          description: Array of item ids
          items:
            type: string
            maxLength: 255
        styleIds:
          type: array
          description: Array of style ids
          items:
            type: string
            maxLength: 255
        productLines:
          type: array
          description: Array of product lines
          items:
            type: string
            maxLength: 255
        productCategories:
          type: array
          description: Array of product categories
          items:
            type: string
            maxLength: 255
        brands:
          type: array
          description: Array of brands
          items:
            type: string
            maxLength: 255
    LabTestUpdateResponse:
      type: object
      properties:
        caseNumber:
          type: string
          description: Lab test case number
        uuid:
          type: string
          description: Lab test uuid
          example: b04ed17c-0253-40a1-bc3c-5df138643057
        code:
          type: integer
          description: Response status code
          example: 204
        status:
          type: integer
          description: Response status code
          example: 204
    LabTestListForItem:
      title: Item
      allOf:
      - $ref: '#/components/schemas/LabTestList'
      - type: object
        properties:
          items:
            $ref: '#/components/schemas/LabTestListResponseItemObject'
    CustomOrg:
      type: object
      properties:
        localOrganizationId:
          type: string
          nullable: true
          maxLength: 255
        name:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        address:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        city:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        country:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        postal:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        province:
          type: string
          nullable: true
          default: ''
          maxLength: 255
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/schemas-Contact'
          nullable: true
        tier:
          type: integer
          maximum: 3
          minimum: 1
          nullable: true
    LabTestCustomOrgWithTier:
      type: object
      properties:
        name:
          type: string
          description: Org name
        address:
          type: string
          description: Address
        city:
          type: string
          description: City
        country:
          type: string
          description: Country
        province:
          type: string
          description: Province
        postal:
          type: string
          description: Postal
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/LabTestCustomOrgContact'
        localOrganizationId:
          type: string
          description: Local org id
        localOrganizationName:
          type: string
          description: Local org name
        tier:
          type: string
          description: Org tier
    BaseLabTestDetailResponsePostfix:
      type: object
      properties:
        overallResult:
          type: object
          properties:
            result:
              $ref: '#/components/schemas/ResultEnum'
              example: pass
