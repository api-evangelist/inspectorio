                questions: []
                selected: false
                text: N/A
              questionType: yes_no
              responseId: null
              validation:
                mandatory: true
            - defaultSubQuestions:
              - defaultSubQuestions: []
                description: Q2-1
                freeTextAnswer: null
                id: fe_SySvsVTLm
                options:
                - id: rJFMs4T8Q
                  questions: []
                  selected: false
                  text: S1
                - id: Sy3Mj4TIm
                  questions: []
                  selected: false
                  text: S2
                - id: HkSDnNaLX
                  questions: []
                  selected: false
                  text: S3
                - id: other
                  otherOptionText: Hello
                  questions: []
                  selected: true
                  text: Other
                questionType: single_select
                responseId: ryCGs4TU7
                validation:
                  mandatory: true
              - defaultSubQuestions: []
                description: Q2-2
                freeTextAnswer: null
                id: fe_Syw6NDpPX
                options:
                - id: 'yes'
                  questions: []
                  selected: false
                  text: 'Yes'
                - id: 'no'
                  questions: []
                  selected: false
                  text: 'No'
                - id: na
                  questions: []
                  selected: false
                  text: N/A
                - id: other
                  otherOptionText: Hello again
                  questions: []
                  selected: true
                  text: Other
                questionType: yes_no
                responseId: null
                validation:
                  mandatory: true
              - defaultSubQuestions: []
                description: Q2-3
                freeTextAnswer: null
                id: fe_SJs6Ew6wm
                options:
                - id: SklfiNaUQ
                  questions: []
                  selected: false
                  text: M1
                - id: S1EMoNaI7
                  questions: []
                  selected: false
                  text: M2
                - id: HySHj3mDX
                  questions: []
                  selected: true
                  text: M3
                - id: other
                  otherOptionText: free text
                  questions: []
