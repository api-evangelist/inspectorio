      - $ref: '#/components/schemas/ValueTypeNumber'
      - $ref: '#/components/schemas/ValueTypeBoolean'
      - $ref: '#/components/schemas/ValueTypeDate'
      - $ref: '#/components/schemas/ValueTypeDateTime'
