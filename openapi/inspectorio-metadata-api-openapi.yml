openapi: 3.2.0
info:
  title: Inspectorio METADATA API
  version: v1
  description: 'Operations tagged METADATA across 2 of this provider''s published API definitions: inspectorio-qrm-openapi.json, inspectorio-rsc-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Production Environment
  url: https://sight.inspectorio.com
- description: Pre-Production Environment
  url: https://sight.pre.inspectorio.com
- description: Production Environment
  url: https://rise-integration.inspectorio.com
- description: Pre-Production Environment
  url: https://rise-integration.pre.inspectorio.com
security:
- ApiKeyAuth: []
tags:
- name: Metadata
paths:
  /api/v1/metadata/{namespace}:
    get:
      summary: List Metadata
      parameters:
      - description: The limitation of the returned results. Use together with ***offset*** param to paginate through items in the results
        in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      - description: End date of the range when metadata was created
        in: query
        name: created_to
        required: false
        schema:
          example: '2021-12-31T23:59:59Z'
          format: date-time
          type: string
      - description: End date of the range when meta data was updated
        in: query
        name: updated_to
        required: false
        schema:
          example: '2021-12-31T23:59:59Z'
          format: date-time
          type: string
      - description: 'Order of metadata in ascending or descending. Only support date filters: ***created_date***, ***updated_date***'
        in: query
        name: order
        required: false
        schema:
          default: created_date:desc
          example: created_date:desc|asc
          type: string
      - description: Start date of the range when meta data was updated
        in: query
        name: updated_from
        required: false
        schema:
          example: '2021-12-31T23:59:59Z'
          format: date-time
          type: string
      - description: Retrieve a subset of results starting with the offset value. Use together with ***limit*** param to paginate through items in the results
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Start date of the range when metadata was created
        in: query
        name: created_from
        required: false
        schema:
          example: '2021-12-31T23:59:59Z'
          format: date-time
          type: string
      - description: The logical type of data that is set by Inspectorio
        in: path
        name: namespace
        required: true
        schema:
          enum:
          - analytics
          - inspection
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataListResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestApiError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedApiError'
          description: Unauthorized
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyResponsesApiError'
          description: Rate-limiting Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
          description: Internal Error
      tags:
      - Metadata
      operationId: getApiV1MetadataByNamespace
      x-operation-id-source: derived
    post:
      summary: Create Metadata
      parameters:
      - description: The logical type of data that is set by Inspectorio
        in: path
        name: namespace
        required: true
        schema:
          enum:
          - analytics
          - inspection
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdateMetadataResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestApiError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedApiError'
          description: Unauthorized
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyResponsesApiError'
          description: Rate-limiting Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
          description: Internal Error
      tags:
      - Metadata
      operationId: postApiV1MetadataByNamespace
      x-operation-id-source: derived
    servers:
    - description: Production Environment
      url: https://sight.inspectorio.com
    - description: Pre-Production Environment
      url: https://sight.pre.inspectorio.com
  /api/v1/metadata/{namespace}/{uid}:
    delete:
      summary: Delete Metadata
      parameters:
      - description: The logical type of data that is set by Inspectorio
        in: path
        name: namespace
        required: true
        schema:
          enum:
          - analytics
          - inspection
          type: string
      - description: UIDs (unique identifiers) are unique within Ecosystem + Namespace. You can consider it as a Unique Keys of ecosystem + namespace + uid
        in: path
        name: uid
        required: true
        schema:
          type: string
      responses:
        '204':
          content:
            application/json:
              schema: {}
          description: No Content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestApiError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedApiError'
          description: Unauthorized
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyResponsesApiError'
          description: Rate-limiting Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
          description: Internal Error
      tags:
      - Metadata
      operationId: deleteApiV1MetadataByNamespaceByUid
      x-operation-id-source: derived
    get:
      summary: Get Metadata
      parameters:
      - description: The logical type of data that is set by Inspectorio
        in: path
        name: namespace
        required: true
        schema:
          enum:
          - analytics
          - inspection
          type: string
      - description: UIDs (unique identifiers) are unique within Ecosystem + Namespace. You can consider it as a Unique Keys of ecosystem + namespace + uid
        in: path
        name: uid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetadataResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestApiError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedApiError'
          description: Unauthorized
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyResponsesApiError'
          description: Rate-limiting Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
          description: Internal Error
      tags:
      - Metadata
      operationId: getApiV1MetadataByNamespaceByUid
      x-operation-id-source: derived
    put:
      summary: Update Metadata
      parameters:
      - description: The logical type of data that is set by Inspectorio
        in: path
        name: namespace
        required: true
        schema:
          enum:
          - analytics
          - inspection
          type: string
      - description: UIDs (unique identifiers) are unique within Ecosystem + Namespace. You can consider it as a Unique Keys of ecosystem + namespace + uid
        in: path
        name: uid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdateMetadataResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestApiError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedApiError'
          description: Unauthorized
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyResponsesApiError'
          description: Rate-limiting Error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
          description: Internal Error
      tags:
      - Metadata
      operationId: putApiV1MetadataByNamespaceByUid
      x-operation-id-source: derived
    servers:
    - description: Production Environment
      url: https://sight.inspectorio.com
    - description: Pre-Production Environment
      url: https://sight.pre.inspectorio.com
components:
  schemas:
    ValueTypeFileRequest:
      properties:
        key:
          description: The key
          example: test_key
          maxLength: 100
          minLength: 1
          type: string
        type:
          description: The type of the value
          enum:
          - file
          type: string
        value:
          description: The value
          example: c6ad775c-00fa-4e66-95c5-baed151d1628
          minLength: 1
          type: string
      required:
      - key
      - type
      - value
      type: object
    InternalApiError:
      properties:
        errorCode:
          example: Generic
          type: string
        errors:
          example:
            system:
            - Internal error detail message
          type: object
        message:
          example: Internal server error
          type: string
      type: object
    MetadataUpdate:
      properties:
        items:
          description: Metadata items
          items:
            $ref: '#/components/schemas/MetadataItemRequest'
          maxItems: 150
          minItems: 1
          type: array
      required:
      - items
      type: object
    ValueTypeNumber:
      properties:
        key:
          description: The key
          example: test_key
          maxLength: 100
          minLength: 1
          type: string
        type:
          description: The type of the value
          enum:
          - number
          type: string
        value:
          description: The value
          example: 2021
          type: number
      required:
      - key
      - type
      - value
      type: object
    TooManyResponsesApiError:
      properties:
        errorCode:
